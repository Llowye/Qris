<script>
function playClickSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  [800, 1200].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.04);
    gain.gain.setValueAtTime(0.4, ctx.currentTime + i * 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.04 + 0.03);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + i * 0.04);
    osc.stop(ctx.currentTime + i * 0.04 + 0.03);
  });
}

document.querySelectorAll('.payments a').forEach(function(a){
  a.addEventListener('click', playClickSound);
});
</script>



<script>
let isPlaying = false;
function toggleMusic(){
  const btn = document.getElementById('musicBtn');
  const icon = document.getElementById('musicIcon');
  const label = document.getElementById('musicLabel');
  const audio = document.getElementById('bgMusic');
  if(!isPlaying){
    audio.play();
    isPlaying = true;
    btn.style.animation = 'none';
    icon.style.animation = 'none';
    icon.textContent = '⏸️';
    label.textContent = 'stop';
  } else {
    audio.pause();
    isPlaying = false;
    btn.style.animation = 'pulseMusic 1.5s ease-in-out infinite';
    icon.style.animation = 'ringPhone 0.8s ease-in-out infinite';
    icon.textContent = '🎵';
    label.textContent = 'music';
  }
}

  document.getElementById('bgMusic').addEventListener('ended', function(){
  isPlaying = false;
  const btn = document.getElementById('musicBtn');
  const icon = document.getElementById('musicIcon');
  const label = document.getElementById('musicLabel');
  btn.style.animation = 'pulseMusic 1.5s ease-in-out infinite';
  icon.style.animation = 'ringPhone 0.8s ease-in-out infinite';
  icon.textContent = '🎵';
  label.textContent = 'music';
});
</script>
